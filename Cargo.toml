[package]
name = "stardrop"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "A calm, dreamy falling game about discovery."
license = "MIT"
publish = false

[features]
default = []
# Fast iteration while developing: `cargo run --features dev`.
dev = [
    "bevy/dynamic_linking", # Bevy is linked as a shared library, so relinking our code is much faster.
    "bevy/file_watcher",    # Reload assets (level files, later) when they change on disk.
    "bevy/bevy_gizmos",     # Debug line drawing for F2 (collision shapes)...
    "bevy/bevy_gizmos_render", # ...and its renderer. Never in shipped builds.
]
# Profiling with Tracy: `cargo run --release --features trace`. Costs nothing when off.
trace = ["bevy/trace_tracy"]

[dependencies]
# Pinned exactly (`=`) so an update can never silently change engine behavior.
# Default features are off; we opt in to only what a 2D game with HDR + bloom needs.
bevy = { version = "=0.19.1", default-features = false, features = [
    # --- App core ---
    "std",                   # Use the standard library (we are a desktop game).
    "async_executor",        # Task pools used by asset loading and the scheduler.
    "bevy_asset",            # Loading assets (meshes, fonts, later levels and sounds).
    "bevy_log",              # `info!`/`warn!` logging instead of `println!`.
    "bevy_state",            # App states (MainMenu, Playing, ...) from Milestone 2 on.
    "reflect_auto_register", # Registers reflected types automatically.
    # --- Window & input ---
    "bevy_window",           # Window abstraction.
    "bevy_winit",            # Actual OS window + event loop.
    "keyboard",              # Keyboard input.
    "mouse",                 # Mouse input (menus).
    "gamepad",               # Gamepad input types.
    # --- 2D rendering ---
    "bevy_render",           # The renderer.
    "bevy_core_pipeline",    # Core 2D render pass.
    "bevy_camera",           # Camera components.
    "bevy_color",            # Color types.
    "bevy_image",            # Images/textures.
    "bevy_mesh",             # Meshes (our shapes are generated meshes).
    "bevy_shader",           # Shader handling.
    "bevy_material",         # Materials.
    "bevy_sprite",           # 2D API: `Mesh2d`, `ColorMaterial`, sprites.
    "bevy_sprite_render",    # Rendering for the above.
    "bevy_post_process",     # Bloom.
    "tonemapping_luts",      # Lookup tables for the TonyMcMapface tonemapper (see docs/DESIGN.md).
    "ktx2",                  # Needed to load the tonemapping lookup tables...
    "zstd_rust",             # ...which are zstd-compressed (pure-Rust decoder, no C toolchain).
    # --- UI & text (F1 overlay, later menus) ---
    "bevy_ui",               # UI layout.
    "bevy_picking",          # Hover/click detection...
    "ui_picking",            # ...for UI nodes (menu buttons).
    "bevy_ui_render",        # UI rendering.
    "bevy_text",             # Text rendering.
    "default_font",          # Built-in font so text works before we ship our own.
] }
# Level files (Section 4). Both are already compiled as part of Bevy, so these
# exact versions add no build time or binary size.
ron = { version = "=0.12.2", default-features = false }   # Reads the RON level format.
serde = { version = "=1.0.229", features = ["derive"] }    # Turns parsed text into our structs.
# Bakes `assets/` into the binary so the game ships as one file (M5-7).
# Switched off by the `dev` feature, which keeps the folder and hot reload.
bevy_embedded_assets = { version = "=0.16.0", default-features = false, features = [
    "default-source",
] }
# Nothing is ever loaded from a sound file: every sound is built in code
# (`synth.rs`). `ogg` is still on because the crate does not compile without
# a decoder feature — its prelude re-exports a type that one provides.
bevy_kira_audio = { version = "=0.26.0", default-features = false, features = ["ogg"] }

# --- Per platform ---------------------------------------------------------

# A desktop runs threads, talks to a window server and has a disk to save on.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "multi_threaded",        # Run systems in parallel across CPU cores.
    "x11",                   # Linux X11 support...
    "wayland",               # ...and native Wayland. Both on: one binary picks whichever
                             # the desktop runs. Building needs libwayland-dev and
                             # libxkbcommon-dev (docs/DESIGN.md M0-2).
    "bevy_gilrs",            # Gamepad backend (gilrs); needs libudev on Linux.
] }
# Finds the per-OS folder for the save file (docs/DESIGN.md M5-4).
dirs = "=7.0.0"

# A browser has one thread, a canvas and no filesystem. Gamepads would need a
# backend `gilrs` does not have on the web, so the browser build is keyboard
# only, which is every input the game reads anyway.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "web",                   # Web platform glue: timers, the canvas, the event loop.
    "webgl2",                # WebGL 2 rather than WebGPU, which Safari only just got.
] }
# The browser's own storage, where the save file goes instead of a folder.
web-sys = { version = "=0.3.105", features = ["Window", "Storage"] }

[dev-dependencies]
# Statistical micro-benchmarks for hot pure functions (Section 7.3). Never shipped.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "logic"
harness = false

# --- Build profiles -------------------------------------------------------

# Our own code: light optimization so the game is playable in debug builds
# while still compiling quickly.
[profile.dev]
opt-level = 1
# No debug info. It is the largest thing in `target/` by far (several GB of a
# debug build of Bevy), and we debug through tests and logs rather than a step
# debugger. Set it back to `true` if you ever need to attach one.
debug = false

# Dependencies (Bevy etc.) rarely change, so optimize them fully once;
# otherwise a debug build of Bevy is far too slow to play.
[profile.dev.package."*"]
opt-level = 3

# Everyday optimized build (quality checks, playtesting). Thin LTO keeps
# rebuilds at ~30 s instead of ~3 min, for a slightly larger binary (docs/DESIGN.md M0-10).
[profile.release]
opt-level = 3       # Optimize for speed.
lto = "thin"        # Cross-crate optimization, done in parallel: most of the benefit, far faster to build.
codegen-units = 1   # One unit gives LLVM the whole picture: better code, slower compile.
strip = true        # Drop debug symbols from the shipped binary.
panic = "abort"     # No unwinding machinery: smaller and faster. A panic ends the game immediately,
                    # which is acceptable because game logic must not panic (Section 7.4).

# What we ship and measure budgets against: `cargo build --profile dist`.
# Every profile built is another full copy of Bevy in `target/`, so build
# this one when you need it and `cargo clean --profile dist` after.
[profile.dist]
inherits = "release"
lto = "fat"         # Whole-program link-time optimization: smallest, fastest binary; slow to build.

# Shipping build with symbols, for profiling (`cargo build --profile profiling`).
[profile.profiling]
inherits = "dist"
strip = false
debug = "line-tables-only"

# --- Lints ---------------------------------------------------------------

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Curated pedantic lints (reasons in docs/DESIGN.md).
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
float_cmp = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
doc_markdown = "warn"
# Panics in game logic (Section 7.4); tests are exempted in clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
# Stray output (use Bevy's logging macros instead).
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
# Bevy systems legitimately take many parameters and complex query types.
too_many_arguments = "allow"
type_complexity = "allow"
