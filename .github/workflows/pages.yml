# Publishes the browser version to GitHub Pages, on a tagged version or on
# demand. Nothing it builds is ever committed: the page, the glue and the
# 38 MB wasm module are built here and handed straight to Pages.
#
# Pages has to be told to take its content from Actions once, by hand:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#
# Pages on a free account only serves a public repository. Making this repo
# private takes the site down with it.
name: pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # Reading the code, writing a deployment, and the token Pages verifies it
  # with. Nothing else.
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: a half-deployed
# site is a broken site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The whole game compiles to one wasm module, which takes a while. No
  # system libraries: the browser build pulls in neither alsa nor udev nor
  # a window server (see the per-platform split in Cargo.toml).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The version has to match the wasm-bindgen crate the build links
      # against, or the glue and the module disagree about their interface.
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: ./scripts/web.sh
      # A built file must not carry the path of the machine that built it.
      # scripts/web.sh remaps them; this is the check that it worked.
      - name: no build paths in the module
        run: |
          if strings web/stardrop_bg.wasm | grep -q "/home/runner"; then
            echo "the module carries the runner's paths"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
