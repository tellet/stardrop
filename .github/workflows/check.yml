# The quality gate, run on every push. Mirrors scripts/check.sh, and adds
# the measurements that the brief sets budgets for (STARDROP.md §7.1).
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The incremental cache is worth a gigabyte and buys nothing here.
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    runs-on: ubuntu-latest
    # A stuck run should fail, not grind for the six hours GitHub allows.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Bevy needs these for sound, gamepads and the two window backends.
      - run: sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Pinned, not `stable`. Clippy changes which code it complains about
      # between releases, and `#[expect(...)]` turns a lint that stops firing
      # into an error, so an unpinned toolchain fails on code nobody touched.
      # Raising this is a deliberate act: bump it, run ./scripts/check.sh,
      # and fix whatever the newer clippy has learned to see.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Save the cache even when the run fails. Otherwise a red build
          # costs a full cold rebuild on the next push as well.
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # The `dev` feature is linted by ./scripts/check.sh, not here: it is a
      # whole second compile of Bevy under a different feature set, and all
      # it covers is hot reload, dynamic linking and the F2 gizmos.
      - run: cargo test
      - run: cargo build --release
      # The budgets. These fail the build, so a regression can't be missed.
      - name: measurements
        run: cargo test --release --lib -- --ignored --nocapture

  # `rust-version` in Cargo.toml says 1.95, so something has to hold us to
  # it. A check, not a build: it catches our own code using anything newer
  # without paying for codegen.
  oldest-supported-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo check --all-targets

  # Known vulnerabilities in anything we depend on. The licences of all 393
  # crates are listed in docs/THIRD-PARTY.md (./scripts/third-party.sh).
  #
  # cargo-audit runs directly rather than through rustsec/audit-check. That
  # action reports by creating a check run, which needs a `checks: write`
  # token it does not get by default, so the job died after the scan had
  # already passed. Run directly it needs no token and works on forks too.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      # Caches ~/.cargo/bin as well, so cargo-audit is only compiled once.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo install cargo-audit --locked
      # Any new unmaintained or yanked crate fails the build. `ttf-parser` is
      # the one exception: it is unmaintained with nothing to move to, and it
      # arrives through winit's Wayland window decorations.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2026-0192

  # The two platforms we have no machine for. Build and test only: nobody
  # here can look at the result, so correctness of the picture is untested.
  other-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test
      - run: cargo build --release
