# The quality gate, run on every push. Mirrors scripts/check.sh, and adds
# the measurements that the brief sets budgets for (STARDROP.md §7.1).
#
# Binaries for the three desktops are built only when asked for, from the
# Actions tab or `gh workflow run check -f binaries=true`.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      binaries:
        description: Also build Linux, Windows and macOS binaries and attach them
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # The incremental cache is worth a gigabyte and buys nothing here.
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    runs-on: ubuntu-latest
    # A stuck run should fail, not grind for the six hours GitHub allows.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Bevy needs these for sound, gamepads and the two window backends.
      - run: sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Pinned, not `stable`. Clippy changes which code it complains about
      # between releases, and `#[expect(...)]` turns a lint that stops firing
      # into an error, so an unpinned toolchain fails on code nobody touched.
      # Raising this is a deliberate act: bump it, run ./scripts/check.sh,
      # and fix whatever the newer clippy has learned to see.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Save the cache even when the run fails. Otherwise a red build
          # costs a full cold rebuild on the next push as well.
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # The `dev` feature is linted by ./scripts/check.sh, not here: it is a
      # whole second compile of Bevy under a different feature set, and all
      # it covers is hot reload, dynamic linking and the F2 gizmos.
      - run: cargo test
      - run: cargo build --release
      # The budgets. These fail the build, so a regression can't be missed.
      - name: measurements
        run: cargo test --release --lib -- --ignored --nocapture

  # Something to hand to someone. The `dist` profile is what we ship: fat
  # LTO, stripped, assets baked into the executable, so each artifact is one
  # file that runs from an empty folder. Fat LTO is slow, which is why this
  # waits to be asked.
  #
  # Windows and macOS are only ever compiled here, so the tests run first.
  binaries:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.binaries }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test
      - run: cargo build --profile dist
      # One of the two paths exists on any given runner; the other is ignored.
      - uses: actions/upload-artifact@v4
        with:
          name: stardrop-${{ matrix.os }}
          path: |
            target/dist/stardrop
            target/dist/stardrop.exe
          if-no-files-found: error
